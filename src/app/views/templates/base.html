<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Controle de Dívidas — Organize suas dívidas com clareza e acompanhe o progresso até a quitação total.">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Controle de Dívidas{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <a href="{{ url_for('dividas.index') }}" class="navbar-brand">
                <span class="brand-icon">◈</span>
                <span class="brand-text">Controle de Dívidas</span>
            </a>
            <div class="navbar-actions">
                <a href="{{ url_for('dividas.index') }}" class="nav-link {% if request.endpoint == 'dividas.index' %}active{% endif %}">
                    Dashboard
                </a>
                <button class="dark-toggle" id="dark-toggle" aria-label="Alternar modo escuro" title="Modo escuro">🌙</button>
                <a href="#" class="btn-primary btn-sm" id="btn-abrir-modal">+ Nova Dívida</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ═══ Modal: Nova Dívida ═══ -->
    <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-title">Nova Dívida</h2>
                <button class="modal-close" id="btn-fechar-modal" aria-label="Fechar modal">✕</button>
            </div>
            <form id="form-nova-divida" novalidate>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="input-nome">Nome da Dívida</label>
                        <input type="text" id="input-nome" name="nome"
                               placeholder="Ex: Negociação Banco Itaú, Cartão Nubank..."
                               required maxlength="100">
                        <span class="field-error" id="erro-nome"></span>
                    </div>
                    <div class="form-group">
                        <label for="input-categoria">Categoria</label>
                        <select id="input-categoria" name="categoria">
                            {% for cat in categorias %}
                            <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-total-parcelas">Número de Parcelas</label>
                        <input type="number" id="input-total-parcelas" name="total_parcelas"
                               placeholder="12" min="1" step="1" required>
                        <span class="field-error" id="erro-total-parcelas"></span>
                    </div>
                    <div class="form-group full-width">
                        <label for="input-valor-total">Valor Total Negociado (R$)</label>
                        <input type="number" id="input-valor-total" name="valor_total"
                               placeholder="0,00" min="0.01" step="0.01" required>
                        <span class="field-error" id="erro-valor-total"></span>
                    </div>
                    <div class="form-group" id="parcela-preview" style="display:none">
                        <div class="parcela-preview-box" style="grid-column: 1 / -1">
                            <span class="parcela-preview-label">Parcela mensal</span>
                            <span class="parcela-preview-valor" id="parcela-preview-valor">R$ 0,00</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="input-dia-vencimento">Dia do Vencimento <span style="opacity:.5">(opcional)</span></label>
                        <input type="number" id="input-dia-vencimento" name="dia_vencimento"
                               placeholder="Ex: 15" min="1" max="31" step="1">
                        <span class="form-hint">Dia do mês em que vence a parcela</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btn-submit">Salvar Dívida</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
